# This package is also the workspace root. `hydra-plugin` is a separate
# member crate (VST3/CLAP/standalone plugin build) that depends on this
# crate as a plain library (`default-features = false`) - see
# `crates/hydra-plugin/README.md`. `xtask` is nih-plug's own bundler,
# invoked via `cargo xtask bundle hydra-plugin --release` (see
# `.cargo/config.toml`/`bundler.toml`) to produce an actual loadable
# `.vst3`/`.clap` bundle.
#
# `default-members` deliberately excludes both: plain `cargo
# build`/`cargo test`/`cargo run` (this project's long-established
# rebuild/test workflow) must keep building/testing only the main
# `hydra-rust` crate + `hydra` binary, without also pulling in nih-plug's
# git dependencies. Build the plugin explicitly with `-p hydra-plugin`,
# or bundle it with `cargo xtask bundle hydra-plugin --release`.
[workspace]
members = [".", "crates/hydra-plugin", "xtask"]
default-members = ["."]

# Override nih-plug's older standalone baseview as well as the plugin editor.
# Cargo requires a different source URL for a git patch; this fork provides
# the exact upstream commit fixing null NSWindow access during initialization.
[patch."https://github.com/RustAudio/baseview.git"]
baseview = { git = "https://github.com/robbert-vdh/baseview.git", rev = "3e1297320f6c9feb01993cba7743277b2d645211" }

[package]
name = "hydra-rust"
version = "0.1.0"
edition = "2024"
description = "Hydra visual synthesizer — Rhai scripting to GLSL, rendered via OpenGL"
license = "AGPL-3.0-or-later"

[dependencies]
rhai = { version = "1", features = ["no_module", "no_time"] }
glow = "0.16"
ab_glyph = "0.2"
nokhwa = { version = "0.10", features = ["input-native"], optional = true }
log = "0.4"
# `eframe`/`rfd` are only used by the `hydra` binary (the desktop app's
# window/editor UI and native file dialogs) - never by the library's own
# `eval`/`renderer`/manager modules. Keeping them optional behind the `gui`
# feature lets downstream crates (e.g. an embedding host like Sova) depend
# on `hydra-rust` as a plain library (`default-features = false`) without
# pulling in egui/egui_glow/winit/arboard/webbrowser and the rest of the
# windowing stack.
eframe = { version = "0.33.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = "0.11"
regex = "1"
rfd = { version = "0.15", optional = true }
cpal = { version = "0.15", optional = true }
rustfft = { version = "6", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
ureq = { version = "2", optional = true, features = ["tls"] }
midir = { version = "0.10", optional = true }
rosc = { version = "0.11", optional = true }
# `default-features = false`: excludes `download_ffmpeg` deliberately - this
# project requires a pre-installed `ffmpeg` on PATH rather than silently
# fetching a large binary off the internet, matching the same "no surprise
# background network/hardware access" precedent as the other features here.
ffmpeg-sidecar = { version = "2", optional = true, default-features = false }
# `webrtc` handles ICE/DTLS/SRTP transport and RTP relaying only - it does
# NOT decode video to pixels (confirmed against its own examples). Decoding
# and encoding are both done by spawning `ffmpeg` instead (the same
# already-depended-on `ffmpeg-sidecar` `video` uses), so this feature adds
# no second video-codec library on top of the one hydra-rust already needs.
# `rtc` (the sans-I/O core `webrtc` wraps) is a private dependency of
# `webrtc` itself, so it must be added directly here too to name its types
# (`MediaEngine`, `RTCConfigurationBuilder`, ...) - versions are kept in
# lockstep with `webrtc` deliberately, and Cargo's feature unification means
# `webrtc`'s own default `crypto-ring` feature already covers this edge.
webrtc = { version = "0.21", optional = true }
rtc = { version = "0.21", optional = true }
# Only `sync` is needed directly (a `oneshot` channel to tell a stream's
# background thread to stop) - `webrtc`'s own default `runtime-tokio`
# feature already pulls in everything needed to actually drive the async
# WebRTC stack, via `webrtc::runtime::default_runtime()`.
tokio = { version = "1", optional = true, default-features = false, features = ["sync"] }
bytes = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }

[features]
# Enabled by default so plain `cargo build`/`cargo run` keeps building the
# `hydra` desktop app unchanged. Library-only consumers should depend with
# `default-features = false` to skip the windowing stack entirely.
default = ["gui", "nsm"]
gui = ["dep:eframe", "dep:rfd"]
nsm = ["dep:rosc"]
webcam = ["dep:nokhwa"]
# `fft`: just the sample-buffer + FFT-analysis pipeline (`AudioBuffer`/
# `AudioAnalyzer`, see `src/audio.rs`), with no OS audio capture of its
# own - lets a host application (e.g. the `hydra-plugin` crate, fed by a
# DAW's own audio buffer) reuse the same FFT-reactive (`a.fft[]`) pipeline
# as the desktop app without pulling in `cpal`/microphone access at all.
fft = ["dep:rustfft"]
# `audio` keeps its old meaning (mic capture via `cpal`, exposed as
# `AudioManager`) - now built on top of `fft` rather than duplicating it.
audio = ["dep:cpal", "fft"]
# Linux JACK input, also usable through PipeWire's JACK compatibility layer.
jack = ["audio", "cpal/jack"]
image_url = ["dep:ureq"]
midi = ["dep:midir"]
osc = ["dep:rosc"]
video = ["dep:ffmpeg-sidecar"]
stream = ["dep:webrtc", "dep:rtc", "dep:tokio", "dep:bytes", "dep:async-trait", "video"]

# Real-time rendering app: thin LTO's cross-crate inlining meaningfully
# helps the hot per-frame path (renderer.rs) and eval()'s Rhai-engine/
# GLSL-codegen path. Measured as effectively free here (~25s clean release
# build either way) - `codegen-units = 1` was tried too but added ~16s for
# comparatively little extra runtime benefit, not worth it given this repo's
# own `--release` iteration loop (examples/check_corpus.rs).
[profile.release]
lto = "thin"

[[bin]]
name = "hydra"
path = "src/bin/hydra/main.rs"
required-features = ["gui"]
